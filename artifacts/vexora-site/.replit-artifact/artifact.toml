kind = "web"
previewPath = "/"
title = "Vexora"
description = "Sito vetrina moderno e professionale per Vexora, con presentazione del brand, servizi, metodo di lavoro e contatti."
version = "1.0.0"
id = "artifacts/vexora-site"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 26191

[services.development]
run = "pnpm --filter @workspace/vexora-site run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/vexora-site", "run", "build" ]
serve = "static"
publicDir = "artifacts/vexora-site/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "26191"
BASE_PATH = "/"
