kind = "web"
previewPath = "/vexora/"
title = "Vexora"
description = "Sito vetrina moderno e professionale per Vexora, un'attività che crea e modifica siti web per negozi, ristoranti e attività locali. Tre pagine: homepage con presentazione, pagina recensioni e pagina contatti. Stile pulito, arioso, con palette chiara e tre versioni del logo."
version = "1.0.0"
id = "artifacts/vexora"
router = "path"

[[services]]
name = "web"
paths = [ "/vexora/" ]
localPort = 23170

[services.development]
run = "pnpm --filter @workspace/vexora run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/vexora", "run", "build" ]
serve = "static"
publicDir = "artifacts/vexora/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "23170"
BASE_PATH = "/vexora/"
